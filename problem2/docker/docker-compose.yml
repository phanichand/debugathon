name: debugathon-problem2
services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  auth-a:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8081:8000"
    environment:
      POD_NAME: auth-a
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: debugathon-local-secret
      REGISTRY_ROLLOUT_PERCENT: "12"
      REPLICATION_FLUSH_MS: "800"
      HYDRATION_INTERVAL_MS: "200"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 20

  auth-b:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8082:8000"
    environment:
      POD_NAME: auth-b
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: debugathon-local-secret
      REGISTRY_ROLLOUT_PERCENT: "12"
      REPLICATION_FLUSH_MS: "800"
      HYDRATION_INTERVAL_MS: "200"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 20

  auth-c:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8083:8000"
    environment:
      POD_NAME: auth-c
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: debugathon-local-secret
      REGISTRY_ROLLOUT_PERCENT: "12"
      REPLICATION_FLUSH_MS: "800"
      HYDRATION_INTERVAL_MS: "200"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 2s
      retries: 20

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-a:
        condition: service_healthy
      auth-b:
        condition: service_healthy
      auth-c:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-a
      - auth-b
      - auth-c
      - redis-exporter

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-a:8000
          - auth-b:8000
          - auth-c:8000

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

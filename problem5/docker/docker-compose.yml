name: debugathon-problem5
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    ports: ["127.0.0.1:5545:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6395:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  pricing-api:
    build: ../services/pricing-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pricing
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INSTANCE_ID: pricing-a
    ports: ["127.0.0.1:8085:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 768m
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:9095:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [pricing-api]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3005:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-debugathon
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
volumes:
  postgres-data:

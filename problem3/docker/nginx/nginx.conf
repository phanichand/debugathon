worker_processes 1;
events { worker_connections 1024; }
http {
  log_format structured escape=json '{"timestamp":"$time_iso8601","event":"gateway_request","request_id":"$http_x_request_id","status":$status,"upstream":"$upstream_addr","duration":$request_time}';
  access_log /dev/stdout structured;
  upstream availability {
    server availability-a:8000 max_fails=0;
    server availability-b:8000 max_fails=0;
    server availability-c:8000 max_fails=0;
    server availability-d:8000 max_fails=0;
  }
  server {
    listen 8080;
    location = /healthz { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
    location = /availability {
      proxy_pass http://availability;
      proxy_next_upstream off;
      proxy_read_timeout 5s;
    }
    location / { return 404; }
  }
}

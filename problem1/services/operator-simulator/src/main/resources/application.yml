server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/operatordb
    username: debugathon
    password: debugathon
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

operator:
  deterministic-timeout-delay-ms: 3000
  initial-profile: NORMAL
  degraded:
    slow-booking-basis-points: 180

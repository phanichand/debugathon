# Preserve the existing Micrometer/custom metrics; Java agent exports traces/logs only.
receivers:
  prometheus:
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
      - job_name: booking-api
        metrics_path: /actuator/prometheus
        static_configs:
        - targets:
          - booking-api:8080
      - job_name: booking-orchestrator
        metrics_path: /actuator/prometheus
        static_configs:
        - targets:
          - booking-orchestrator:8081
      - job_name: payment-simulator
        metrics_path: /actuator/prometheus
        static_configs:
        - targets:
          - payment-simulator:8082
      - job_name: operator-simulator
        metrics_path: /actuator/prometheus
        static_configs:
        - targets:
          - operator-simulator:8083
processors:
  batch: {}
  resource:
    attributes:
    - key: cube.environment
      value: debugathon-problem1
      action: upsert
exporters:
  otlphttp/cubeapm:
    metrics_endpoint: http://cubeapm:3130/api/metrics/v1/save/otlp
service:
  pipelines:
    metrics:
      receivers:
      - prometheus
      processors:
      - resource
      - batch
      exporters:
      - otlphttp/cubeapm

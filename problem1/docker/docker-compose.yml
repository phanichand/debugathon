services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: debugathon
      POSTGRES_PASSWORD: debugathon
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debugathon"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-api:
    build:
      context: ..
      dockerfile: services/booking-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ORCHESTRATOR_SERVICE_BASE_URL: http://booking-orchestrator:8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      booking-orchestrator:
        condition: service_healthy

  booking-orchestrator:
    build:
      context: ..
      dockerfile: services/booking-orchestrator/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestratordb
      PAYMENT_SERVICE_BASE_URL: http://payment-simulator:8082
      OPERATOR_SERVICE_BASE_URL: http://operator-simulator:8083
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
      operator-simulator:
        condition: service_healthy

  payment-simulator:
    build:
      context: ..
      dockerfile: services/payment-simulator/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  operator-simulator:
    build:
      context: ..
      dockerfile: services/operator-simulator/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/operatordb
      OPERATOR_INITIAL_PROFILE: DEGRADED
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      booking-api:
        condition: service_healthy
      booking-orchestrator:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy
      operator-simulator:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.1
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.1.1
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

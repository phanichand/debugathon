name: Problem 5 CI
on:
  push:
    paths: ["problem5/**", ".github/workflows/problem5-ci.yml"]
  pull_request:
    paths: ["problem5/**", ".github/workflows/problem5-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: problem5/services/pricing-api/pom.xml
      - name: Unit tests
        working-directory: problem5/services/pricing-api
        run: mvn -B test
      - name: Validate scripts and Compose
        working-directory: problem5
        run: |
          python3 -m py_compile scripts/*.py
          bash -n scripts/smoke-test.sh scripts/generate-traffic.sh
          docker compose -f docker/docker-compose.yml config --quiet
      - name: Start stack
        working-directory: problem5
        run: docker compose -f docker/docker-compose.yml up -d --build
      - name: Happy path and normal regression
        working-directory: problem5
        run: bash scripts/smoke-test.sh
      - name: Customer workload
        working-directory: problem5
        run: bash scripts/generate-traffic.sh --seconds 100 --require-signal
      - name: Normal regression after workload
        working-directory: problem5
        run: bash scripts/smoke-test.sh
      - name: Capture evidence
        if: always()
        working-directory: problem5
        run: |
          mkdir -p artifacts
          docker compose -f docker/docker-compose.yml logs --no-color pricing-api > artifacts/service.log
          docker compose -f docker/docker-compose.yml ps > artifacts/containers.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: problem5-evidence
          path: problem5/artifacts/
          retention-days: 7
      - name: Stop stack
        if: always()
        working-directory: problem5
        run: docker compose -f docker/docker-compose.yml down -v
